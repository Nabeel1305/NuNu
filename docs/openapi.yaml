openapi: 3.1.0
info:
  title: Offline Payment Platform API
  version: 1.0.0
  description: |
    Issue one-time payment codes that a payer later redeems by voice call. The
    platform verifies the call and instructs your system to settle; it never
    holds funds. All requests are JSON over HTTPS and need a bearer API key.
servers:
  - url: https://api.example.com/api/v1
    description: Replace with your deployment's base URL.
security:
  - bearerAuth: []
paths:
  /subscribers/{reference}:
    put:
      summary: Register or update a payer
      parameters: [{ $ref: '#/components/parameters/reference' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [account_number, bank_code]
              properties:
                account_number: { type: string, pattern: '^\d{10}$', description: The payer's bank account. Funds are held on it when a code is issued. Format is configurable per deployment. }
                bank_code: { type: string, pattern: '^[A-Za-z0-9]{3,10}$', description: Bank code of that account (e.g. 058). }
                phone: { type: [string, 'null'], maxLength: 32, description: Used to match the caller when caller binding is on. }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Subscriber' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Subscriber' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /merchants/{reference}:
    get:
      summary: Read a merchant (including the short id used in offline phone codes)
      parameters: [{ $ref: '#/components/parameters/reference' }]
      responses:
        '200': { description: The merchant, content: { application/json: { schema: { $ref: '#/components/schemas/Merchant' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Register or update a payee
      parameters: [{ $ref: '#/components/parameters/reference' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, account_number, bank_code]
              properties:
                name: { type: string, maxLength: 191 }
                account_number: { type: string, pattern: '^\d{10}$', description: The account credited when a payment is captured. }
                bank_code: { type: string, pattern: '^[A-Za-z0-9]{3,10}$' }
                account_reference: { type: [string, 'null'], maxLength: 191, description: Optional label of your own for that account. }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Merchant' } } } }
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Merchant' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /subscribers/{reference}/devices:
    post:
      summary: Enrol a phone for offline payment codes
      description: |
        Lets the subscriber's phone build signed 40-digit codes with no connection. Needs the feature switched on
        for the account (403 device_codes_disabled otherwise) and a subscriber with a bank account on file.
        Returns the phone's secret key; it is derived, not stored, so repeating the call returns the same key.
      parameters: [{ $ref: '#/components/parameters/reference' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id: { type: string, minLength: 8, maxLength: 191, description: Your identifier for this installation of your app. }
      responses:
        '201': { description: Enrolled, content: { application/json: { schema: { $ref: '#/components/schemas/EnrolledDevice' } } } }
        '200': { description: Already enrolled; same key returned, content: { application/json: { schema: { $ref: '#/components/schemas/EnrolledDevice' } } } }
        '403': { description: Feature not enabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      summary: List a subscriber's devices (never includes keys)
      parameters: [{ $ref: '#/components/parameters/reference' }]
      responses:
        '200': { description: The devices, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Device' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /subscribers/{reference}/devices/{deviceId}:
    delete:
      summary: Revoke a phone
      description: Takes effect immediately. Re-enrolling the same device_id later issues a new key and resets the counter.
      parameters:
        - { $ref: '#/components/parameters/reference' }
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Revoked, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhook-endpoints:
    post:
      summary: Register a webhook endpoint
      description: The signing secret is returned once. Store it; it cannot be retrieved later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: Public https address. }
                events:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/EventType' }
                  description: Omit to receive every event.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  url: { type: string }
                  events: { type: [array, 'null'], items: { $ref: '#/components/schemas/EventType' } }
                  secret: { type: string, description: Shown once. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /codes:
    post:
      summary: Issue a payment code
      description: |
        Places a hold through your settlement system, then returns the code. The
        plain code appears only in this response. Retrying with the same
        Idempotency-Key and body returns the same response.
      parameters: [{ $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscriber_reference, merchant_reference, amount_minor, currency]
              properties:
                subscriber_reference: { type: string }
                merchant_reference: { type: string }
                merchant:
                  type: object
                  required: [name, account_number, bank_code]
                  description: |
                    Optional. If merchant_reference is not registered yet, it is created from these details
                    together with the code (only when the hold succeeds). An existing merchant is never
                    changed; a different account_number or bank_code is refused with 422.
                  properties:
                    name: { type: string, maxLength: 191 }
                    account_number: { type: string, pattern: '^\d{10}$' }
                    bank_code: { type: string, pattern: '^[A-Za-z0-9]{3,10}$' }
                    account_reference: { type: [string, 'null'], maxLength: 191 }
                amount_minor: { type: integer, minimum: 1, description: Smallest currency unit, e.g. kobo. }
                currency: { type: string, minLength: 3, maxLength: 3, examples: [NGN] }
                source_account_reference: { type: string, description: 'Optional label of your own for the paying account. Funds are held on the subscriber''s registered account either way. Defaults to its account number.' }
      responses:
        '201': { description: Issued, content: { application/json: { schema: { $ref: '#/components/schemas/IssuedCode' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Validation, idempotency or settlement rejection, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /codes/{id}:
    get:
      summary: Read a code
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: The code, without its digits, content: { application/json: { schema: { $ref: '#/components/schemas/Code' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /codes/{id}/cancel:
    post:
      summary: Cancel an unredeemed code
      description: Releases the hold. Only a code in state `issued` can be cancelled.
      parameters:
        - { $ref: '#/components/parameters/id' }
        - { $ref: '#/components/parameters/idempotencyKey' }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Code' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already redeemed, expired or cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /transactions/{id}:
    get:
      summary: Read the outcome of a redemption
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: The transaction, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
webhooks:
  event:
    post:
      summary: Event delivered to your endpoint
      description: |
        Signed with `Offline-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>" using your endpoint secret>`.
        Reject deliveries whose timestamp is more than five minutes old. Answer with any 2xx
        to acknowledge; other answers are retried with growing delays. The same event id can
        arrive more than once, so process by id.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        '200': { description: Acknowledged }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: 'API key, e.g. opk_1a2b3c4d_...' }
  parameters:
    reference: { name: reference, in: path, required: true, schema: { type: string }, description: Your own identifier. }
    id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    idempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 }, description: A unique value per intended operation, reused when retrying. Remembered for 24 hours. }
  responses:
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Validation failed, content: { application/json: { schema: { type: object, properties: { message: { type: string }, errors: { type: object } } } } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, examples: [settlement_rejected] }
            message: { type: string }
    Device:
      type: object
      properties:
        device_id: { type: string }
        short_id: { type: string, description: 8 digits; what the phone puts in every code. }
        subscriber_reference: { type: string }
        status: { type: string, enum: [active, revoked] }
        key_version: { type: integer }
        last_counter: { type: integer, description: Highest counter accepted; the phone resumes from this + 1. }
        last_used_at: { type: [string, 'null'], format: date-time }
    EnrolledDevice:
      allOf:
        - { $ref: '#/components/schemas/Device' }
        - type: object
          properties:
            device_key: { type: string, description: 'Base64 of the 32-byte secret key. Store it in secure hardware; never log it.' }
            currency: { type: string, examples: [NGN] }
            code_length: { type: integer, examples: [40] }
            window_seconds: { type: integer, examples: [300] }
            voice_number: { type: [string, 'null'], description: 'The number the phone rings (E.164), so it needs no connection to know it. Null until one is set up.', examples: ['+2347000000001'] }
            max_amount_minor: { type: integer, description: 'The most one offline payment can be, in kobo, so the phone can refuse a larger one before dialling.', examples: [2000000] }
            daily_limit_minor: { type: integer, description: 'The most a subscriber can pay offline in a day, in kobo.', examples: [5000000] }
            dial_prefix: { type: string, description: 'On a shared voice number, the 4-digit short code that goes in front of the 40 digits; empty on your own number.', examples: ['1001'] }
    Subscriber:
      type: object
      properties: { reference: { type: string }, phone: { type: [string, 'null'] }, account_number: { type: string }, bank_code: { type: string } }
    Merchant:
      type: object
      properties: { reference: { type: string }, short_id: { type: string, description: 8 digits; what a phone puts in an offline code. Never changes. }, name: { type: string }, account_number: { type: string }, bank_code: { type: string }, account_reference: { type: [string, 'null'] } }
    CodeState:
      type: string
      enum: [issued, redeemed, settled, failed, cancelled, expired]
    Code:
      type: object
      properties:
        id: { type: string, format: uuid }
        origin: { type: string, enum: [issued, device] }
        subscriber_reference: { type: [string, 'null'], description: Your reference for the payer. }
        merchant_reference: { type: [string, 'null'], description: Your reference for the payee. }
        device_id: { type: [string, 'null'], description: 'For a code a phone built offline: the device_id it was enrolled with. Null otherwise.' }
        device_counter: { type: [integer, 'null'], description: 'For a code a phone built offline: the counter the phone put in it, so the phone can find its own payment. Null otherwise.' }
        state: { $ref: '#/components/schemas/CodeState' }
        amount_minor: { type: integer }
        currency: { type: string }
        expires_at: { type: string, format: date-time }
        redeemed_at: { type: [string, 'null'], format: date-time }
    IssuedCode:
      allOf:
        - { $ref: '#/components/schemas/Code' }
        - type: object
          properties:
            code: { type: string, description: The digits the payer dials. Shown once. }
            merchant_created: { type: boolean, description: True when this request registered the merchant. }
            voice_number: { type: [string, 'null'], description: 'The number the payer rings (E.164). Null until one is set up for your account.', examples: ['+2347000000001'] }
            dial_string: { type: [string, 'null'], description: 'Number, pauses and code in one string for a dialler: voice number, ",,", the code and a closing "#". Shown once.', examples: ['+2347000000001,,482019377104#'] }
            dial_uri: { type: [string, 'null'], description: 'The same as a tel: link, with the "#" percent-encoded. Shown once.', examples: ['tel:+2347000000001,,482019377104%23'] }
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        code_id: { type: string, format: uuid }
        origin: { type: string, enum: [issued, device] }
        subscriber_reference: { type: [string, 'null'], description: Your reference for the payer. }
        merchant_reference: { type: [string, 'null'], description: Your reference for the payee. }
        device_id: { type: [string, 'null'], description: 'For a code a phone built offline: the device_id it was enrolled with. Null otherwise.' }
        device_counter: { type: [integer, 'null'], description: 'For a code a phone built offline: the counter the phone put in it, so the phone can find its own payment. Null otherwise.' }
        reference: { type: string }
        status: { type: string, enum: [pending, settled, failed] }
        amount_minor: { type: integer }
        currency: { type: string }
        settlement_reference: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'] }
    EventType:
      type: string
      enum: [code.redeemed, transaction.settled, transaction.failed, code.expired, code.rejected]
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/EventType' }
        created_at: { type: string, format: date-time }
        data: { type: object, description: 'A Code for code.redeemed and code.expired, a Transaction for transaction.* events, and a rejection object (origin, reason, device_id, subscriber_reference, merchant_reference, amount_minor, currency) for code.rejected. Codes and transactions carry origin: issued or device.' }
